name: Set topics

on:
  workflow_dispatch:

jobs:
  topics:
    runs-on: ubuntu-latest
    steps:
      - name: Apply topics to every repository
        env:
          GH_TOKEN: ${{ secrets.TOPICS_TOKEN }}
        run: |
          apply() {
            repo=$1; shift
            for t in "$@"; do echo "$t"; done | jq -R . | jq -s '{names: .}' > body.json
            n=$(gh api -X PUT "repos/privshell/$repo/topics" --input body.json --jq '.names | length')
            echo "$repo: $n topics"
          }
